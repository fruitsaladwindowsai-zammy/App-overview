[package]
name = "winscroller-2d-appview"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Winscroller 2d Appview contributors"]
description = "A native fullscreen & floating Launchpad-style 2D application launcher for Windows 10/11 with 4-finger touchpad gestures, spring physics, and frosted wallpaper blur"
repository = "https://github.com/fruitsaladwindowsai-zammy/App-overview"
readme = "README.md"
keywords = ["windows", "launcher", "launchpad", "touchpad", "rust"]
categories = ["os::windows-apis", "gui"]

[lib]
name = "winscroller_2d_appview"
path = "src/lib.rs"

[[bin]]
name = "winscroller-2d-appview"
path = "src/main.rs"

[dependencies]
eframe = "0.28.1"
egui = "0.28.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
walkdir = "2.5"
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
