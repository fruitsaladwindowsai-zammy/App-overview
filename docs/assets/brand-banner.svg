<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="18%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="72%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRust" cx="85%" cy="85%" r="38%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="62%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="cyanTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="blueTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violetTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="rustTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f74c00"/>
    </linearGradient>
    <pattern id="latticeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="cardDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base Rounded Card & Aurora Glows -->
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#latticeGrid)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowViolet)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowRust)"/>

  <!-- Left Brand Mark (2x2 Launchpad Icon) -->
  <g transform="translate(80, 72)" filter="url(#cardDrop)">
    <rect x="0" y="0" width="176" height="176" rx="38" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.38" stroke-width="2.5"/>
    <rect x="22" y="22" width="58" height="58" rx="15" fill="url(#cyanTile)"/>
    <rect x="96" y="22" width="58" height="58" rx="15" fill="url(#blueTile)"/>
    <rect x="22" y="96" width="58" height="58" rx="15" fill="url(#rustTile)"/>
    <rect x="96" y="96" width="58" height="58" rx="15" fill="url(#violetTile)"/>
  </g>

  <!-- Right Wordmark & Tagline -->
  <g transform="translate(296, 122)">
    <text x="0" y="0" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.2" fill="url(#wordmarkGrad)">Winscroller 2d Appview</text>
    <text x="2" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">Native Launchpad-Style 2D Application Overview for Windows 10 / 11</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 72)" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="192" height="32" rx="16" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4" fill="#00f5d4"/>
      <text x="30" y="20" fill="#00f5d4">4-Finger Gestures</text>

      <rect x="206" y="0" width="178" height="32" rx="16" fill="#0f172a" stroke="#89b4fa" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="224" cy="16" r="4" fill="#89b4fa"/>
      <text x="236" y="20" fill="#bfdbfe">Spring Physics</text>

      <rect x="398" y="0" width="184" height="32" rx="16" fill="#0f172a" stroke="#f74c00" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="416" cy="16" r="4" fill="#f74c00"/>
      <text x="428" y="20" fill="#fdba74">Pure Rust Win32</text>

      <rect x="596" y="0" width="192" height="32" rx="16" fill="#0f172a" stroke="#cba6f7" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="614" cy="16" r="4" fill="#cba6f7"/>
      <text x="626" y="20" fill="#e9d5ff">Frosted Wallpaper</text>
    </g>
  </g>
</svg>
