[package]
name = "winscroller-2d-appview"
version = "0.1.0"
edition = "2021"
description = "A fullscreen Launchpad-style app launcher for Windows - Winscroller 2d Appview"

[lib]
name = "winscroller_2d_appview"
path = "src/lib.rs"

[[bin]]
name = "winscroller-2d-appview"
path = "src/main.rs"

[dependencies]
eframe = "0.28.1"
egui = "0.28.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
walkdir = "2.5"
windows = { version = "0.48.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
