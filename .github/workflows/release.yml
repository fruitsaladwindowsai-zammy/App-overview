name: Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  publish-release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            git fetch --tags --force
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match '(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3]
            } else {
              $major = 0; $minor = 1; $patch = 0
            }

            $baseTag = "v$major.$minor.$patch"
            $existing = git tag -l "v$major.$minor.*"
            if (-not $existing) {
              $tag = $baseTag
            } else {
              $maxPatch = $patch - 1
              foreach ($t in $existing) {
                if ($t -match "^v$major\.$minor\.(\d+)$") {
                  $p = [int]$Matches[1]
                  if ($p -gt $maxPatch) { $maxPatch = $p }
                }
              }
              $nextPatch = $maxPatch + 1
              $tag = "v$major.$minor.$nextPatch"
            }
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive & checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\winscroller-2d-appview.exe dist\
          Copy-Item winscroller-2d-appview.example.toml dist\
          Copy-Item README.md dist\
          Copy-Item KEYBINDINGS.md dist\
          Copy-Item CONFIGURATION.md dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath winscroller-2d-appview-x86_64-pc-windows-msvc.zip -Force
          $exeHash = (Get-FileHash target\release\winscroller-2d-appview.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash winscroller-2d-appview-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  winscroller-2d-appview.exe"
            "$zipHash  winscroller-2d-appview-x86_64-pc-windows-msvc.zip"
          ) | Set-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Winscroller 2d Appview ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
          files: |
            target\release\winscroller-2d-appview.exe
            winscroller-2d-appview-x86_64-pc-windows-msvc.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
