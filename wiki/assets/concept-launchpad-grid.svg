<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrid" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="55%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <style>
    @keyframes haloPulse {
      0%, 100% { opacity: 0.18; transform: scale(1.0); }
      50% { opacity: 0.30; transform: scale(1.06); }
    }
    @keyframes pageGlide {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-18px); }
    }
    .halo { transform-origin: 486px 290px; animation: haloPulse 3.2s infinite ease-in-out; }
    .glide { animation: pageGlide 5s infinite ease-in-out; }
    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <rect width="1200" height="750" fill="url(#bgGrid)"/>

  <!-- Ambient Blurred Wallpaper Orbs -->
  <circle cx="280" cy="220" r="240" fill="#1e3a8a" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="920" cy="520" r="260" fill="#581c87" opacity="0.20" filter="url(#softGlow)"/>

  <!-- Header Badge -->
  <g transform="translate(600, 44)">
    <rect x="-290" y="-18" width="580" height="36" rx="18" fill="rgba(12, 18, 32, 0.92)" stroke="url(#accentCyan)" stroke-width="1.5"/>
    <circle cx="-264" cy="0" r="5" fill="#00f5d4"/>
    <text x="-248" y="4" fill="#f8fafc" font-size="13" font-weight="700">2D Paginated Launchpad Grid &amp; Borderless Icon Halo</text>
    <text x="195" y="4" fill="#89b4fa" font-size="11" class="mono">7×5 · 92% WIDTH</text>
  </g>

  <!-- Main Viewport Frame -->
  <g transform="translate(80, 88)" filter="url(#cardShadow)">
    <rect width="1040" height="590" rx="22" fill="rgba(14, 20, 34, 0.72)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Search Pill -->
    <g transform="translate(310, 30)">
      <rect width="420" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="#89b4fa" stroke-width="1.5"/>
      <text x="24" y="27" fill="#89b4fa" font-size="14">🔍</text>
      <text x="50" y="27" fill="#f8fafc" font-size="14">Search applications...</text>
      <text x="355" y="27" fill="rgba(255,255,255,0.55)" font-size="12" class="mono">73 apps</text>
    </g>

    <!-- Grid Icons (Page 0) -->
    <g class="glide">
      <!-- Row 1 -->
      <g transform="translate(90, 120)">
        <!-- Col 1 -->
        <rect x="0" y="0" width="76" height="76" rx="18" fill="#2563eb"/>
        <text x="38" y="46" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">B</text>
        <text x="38" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Brave</text>

        <!-- Col 2 -->
        <rect x="135" y="0" width="76" height="76" rx="18" fill="#0f766e"/>
        <text x="173" y="46" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">C</text>
        <text x="173" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Calculator</text>

        <!-- Col 3 -->
        <rect x="270" y="0" width="76" height="76" rx="18" fill="#334155"/>
        <text x="308" y="46" fill="#fff" font-size="24" class="mono" font-weight="700" text-anchor="middle">&gt;_</text>
        <text x="308" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Terminal</text>

        <!-- Col 4 (SELECTED - BORDERLESS AMBIENT WASH + 1.10x SCALE) -->
        <rect class="halo" x="392" y="-12" width="104" height="104" rx="34" fill="#ffffff"/>
        <rect x="401" y="-4" width="84" height="84" rx="20" fill="url(#accentViolet)"/>
        <text x="443" y="47" fill="#090d16" font-size="30" font-weight="800" text-anchor="middle">VS</text>
        <rect x="398" y="88" width="90" height="22" rx="11" fill="rgba(255,255,255,0.14)"/>
        <text x="443" y="103" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">VS Code</text>

        <!-- Col 5 -->
        <rect x="540" y="0" width="76" height="76" rx="18" fill="#ea580c"/>
        <text x="578" y="46" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">F</text>
        <text x="578" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Firefox</text>

        <!-- Col 6 -->
        <rect x="675" y="0" width="76" height="76" rx="18" fill="#1d4ed8"/>
        <text x="713" y="46" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">E</text>
        <text x="713" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Explorer</text>

        <!-- Col 7 -->
        <rect x="810" y="0" width="76" height="76" rx="18" fill="#7c3aed"/>
        <text x="848" y="46" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">O</text>
        <text x="848" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Obsidian</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(90, 275)">
        <rect x="0" y="0" width="76" height="76" rx="18" fill="#0284c7"/>
        <text x="38" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">D</text>
        <text x="38" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Docker</text>

        <rect x="135" y="0" width="76" height="76" rx="18" fill="#4f46e5"/>
        <text x="173" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">G</text>
        <text x="173" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">GitHub</text>

        <rect x="270" y="0" width="76" height="76" rx="18" fill="#16a34a"/>
        <text x="308" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">S</text>
        <text x="308" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Spotify</text>

        <rect x="405" y="0" width="76" height="76" rx="18" fill="#0891b2"/>
        <text x="443" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">N</text>
        <text x="443" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Notepad</text>

        <rect x="540" y="0" width="76" height="76" rx="18" fill="#db2777"/>
        <text x="578" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">M</text>
        <text x="578" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Media</text>

        <rect x="675" y="0" width="76" height="76" rx="18" fill="#65a30d"/>
        <text x="713" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">NV</text>
        <text x="713" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">NVIDIA</text>

        <rect x="810" y="0" width="76" height="76" rx="18" fill="#475569"/>
        <text x="848" y="46" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">⚙</text>
        <text x="848" y="98" fill="#e2e8f0" font-size="12" text-anchor="middle">Settings</text>
      </g>
    </g>

    <!-- Callout Annotation: Borderless Selection -->
    <g transform="translate(595, 118)">
      <line x1="-18" y1="30" x2="26" y2="30" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="28" y="4" width="290" height="56" rx="10" fill="rgba(10, 15, 28, 0.95)" stroke="#00f5d4" stroke-width="1.2"/>
      <text x="42" y="25" fill="#00f5d4" font-size="11" font-weight="700">BORDERLESS ICON HALO</text>
      <text x="42" y="44" fill="#cbd5e1" font-size="11" class="mono">1.10x scale · Stroke::NONE</text>
    </g>

    <!-- Continuous Swipe Indicator -->
    <g transform="translate(360, 465)">
      <rect width="320" height="40" rx="20" fill="rgba(0, 245, 212, 0.08)" stroke="rgba(0, 245, 212, 0.35)" stroke-width="1"/>
      <text x="160" y="25" fill="#00f5d4" font-size="12" font-weight="600" text-anchor="middle">←  Two-Finger Continuous Swipe  →</text>
    </g>

    <!-- Morphing Pagination Pills -->
    <g transform="translate(476, 540)">
      <rect x="0" y="0" width="28" height="8" rx="4" fill="#89b4fa"/>
      <rect x="38" y="0" width="8" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
      <rect x="56" y="0" width="8" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
    </g>
  </g>
</svg>
