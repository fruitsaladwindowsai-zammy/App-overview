name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\winscroller-2d-appview.exe dist\
          Copy-Item winscroller-2d-appview.example.toml dist\
          Copy-Item README.md dist\
          Copy-Item KEYBINDINGS.md dist\
          Copy-Item CONFIGURATION.md dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath winscroller-2d-appview-x86_64-pc-windows-msvc.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: winscroller-2d-appview-x86_64-pc-windows-msvc.zip
          draft: false
          prerelease: false
