<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSearch" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="65%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <rect width="1200" height="750" fill="url(#bgSearch)"/>

  <g transform="translate(600, 48)">
    <rect x="-310" y="-18" width="620" height="36" rx="18" fill="rgba(14, 20, 32, 0.95)" stroke="url(#sGrad)" stroke-width="1.5"/>
    <circle cx="-284" cy="0" r="5" fill="#00f5d4"/>
    <text x="-268" y="4" fill="#f8fafc" font-size="13" font-weight="700">Alfred-Style Multi-Tier Fuzzy Search Engine (src/model.rs)</text>
    <text x="220" y="4" fill="#89b4fa" font-size="11" class="mono">&lt;0.1ms</text>
  </g>

  <!-- Query Pill -->
  <g transform="translate(330, 108)">
    <rect width="540" height="54" rx="27" fill="rgba(20, 26, 44, 0.92)" stroke="#89b4fa" stroke-width="2"/>
    <text x="28" y="33" fill="#89b4fa" font-size="16">🔍</text>
    <text x="60" y="33" fill="#ffffff" font-size="16" class="mono">vsc</text>
    <rect x="94" y="16" width="2.5" height="22" fill="#00f5d4"/>
    <text x="430" y="33" fill="#94a3b8" font-size="13" class="mono">1 found</text>
  </g>

  <!-- Scoring Tiers Card -->
  <g transform="translate(80, 198)">
    <rect width="1040" height="480" rx="18" fill="#0c1322" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <text x="32" y="42" fill="#00f5d4" font-size="14" font-weight="700">RANKING WEIGHT TIERS (HIGHEST SCORE WINS)</text>

    <!-- Tier Bars -->
    <!-- Tier 1 -->
    <g transform="translate(32, 72)">
      <rect width="976" height="58" rx="10" fill="#111b30"/>
      <rect width="840" height="58" rx="10" fill="rgba(0, 245, 212, 0.16)"/>
      <text x="20" y="26" fill="#00f5d4" font-size="13" font-weight="700">+5000 pts — Whole Query Starts Name</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="11.5" class="mono">"chr" → "Chrome" (exact leading match + shorter name tiebreaker)</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(32, 144)">
      <rect width="976" height="58" rx="10" fill="#111b30"/>
      <rect width="680" height="58" rx="10" fill="rgba(137, 180, 250, 0.18)"/>
      <text x="20" y="26" fill="#89b4fa" font-size="13" font-weight="700">+1200 / +1000 pts — Word Prefix Match (idx 0 vs later words)</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="11.5" class="mono">"code" → "Visual Studio [Code]" (camelCase &amp; whitespace split)</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(32, 216)">
      <rect width="976" height="58" rx="10" fill="#111b30"/>
      <rect width="540" height="58" rx="10" fill="rgba(203, 166, 247, 0.18)"/>
      <text x="20" y="26" fill="#cba6f7" font-size="13" font-weight="700">+900 pts — Acronym / Initials Match (len ≥ 2)</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="11.5" class="mono">"vsc" → "[V]isual [S]tudio [C]ode" · "cp" → "[C]ontrol [P]anel"</text>
    </g>

    <!-- Tier 4 -->
    <g transform="translate(32, 288)">
      <rect width="976" height="58" rx="10" fill="#111b30"/>
      <rect width="400" height="58" rx="10" fill="rgba(250, 179, 135, 0.16)"/>
      <text x="20" y="26" fill="#fab387" font-size="13" font-weight="700">+600 / +500 pts — AppID Word Prefix &amp; Folded Substring (len ≥ 3)</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="11.5" class="mono">"cmd" → "{System32}\cmd.exe" · "fox" → "Fire[fox]"</text>
    </g>

    <!-- Tier 5 -->
    <g transform="translate(32, 360)">
      <rect width="976" height="58" rx="10" fill="#111b30"/>
      <rect width="260" height="58" rx="10" fill="rgba(166, 227, 161, 0.16)"/>
      <text x="20" y="26" fill="#a6e3a1" font-size="13" font-weight="700">+300 pts — Keyword Tag Prefix</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="11.5" class="mono">Matches secondary metadata tags; multi-term AND filtering</text>
    </g>

    <text x="32" y="454" fill="#94a3b8" font-size="12" class="mono">Final Rank = sum(term_scores) + prefix_bonus - name_folded.len()</text>
  </g>
</svg>
