<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f74c00"/>
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Obsidian Rounded Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="10"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#00f5d4" stroke-opacity="0.24" stroke-width="3"/>

  <!-- 2x2 Launchpad Appview Tiles -->
  <rect x="76" y="76" width="160" height="160" rx="38" fill="url(#cyanGrad)" filter="url(#tileGlow)"/>
  <rect x="276" y="76" width="160" height="160" rx="38" fill="url(#blueGrad)" filter="url(#tileGlow)"/>
  <rect x="76" y="276" width="160" height="160" rx="38" fill="url(#rustGrad)" filter="url(#tileGlow)"/>
  <rect x="276" y="276" width="160" height="160" rx="38" fill="url(#violetGrad)" filter="url(#tileGlow)"/>

  <!-- Subtle Pagination Pill Indicator -->
  <rect x="218" y="458" width="48" height="10" rx="5" fill="#89b4fa"/>
  <circle cx="282" cy="463" r="5" fill="#94a3b8" opacity="0.55"/>
</svg>
